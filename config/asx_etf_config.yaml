config:
  # Input ticker list, resolved against the project root.
  ticker_file: config/asx_etf.csv

  # Generated artefacts, resolved against STOCKS_DATA_ROOT if that env var is
  # set, otherwise against <project_root>/data.
  data_dir: asx/etf
  db_path: asx.db

  analysis:
    # How a window's percentage change is defined.
    #   google_finance  single closes, the last session on or before the
    #                   calendar anchor, and the raw (split-adjusted,
    #                   dividend-unadjusted) close -- the number a Google
    #                   Finance quote page shows, so results can be checked
    #                   against one directly. endpoint_window does not apply.
    #   robust          median of endpoint_window closes at each end, the first
    #                   session inside the window, and the fully adjusted
    #                   series. Counts dividends, so it reads higher than
    #                   Google Finance on anything with a yield.
    return_basis: google_finance
    # Prices are AUD on the ASX. ETFs commonly trade in the A$3-10 range, so
    # a A$10 floor would discard roughly a fifth of the universe.
    min_price: 2.0
    # ASX ETFs turn over far less on-screen volume than NASDAQ equities
    # (median ~8k shares/day vs ~188k), and market-maker creation/redemption
    # means screen volume understates their real liquidity. This floor only
    # removes the genuinely dormant tail.
    min_median_volume: 1000
    # Require 80% of the window's calendar span before reporting a ticker for
    # it, so recent listings do not appear in the longer-window tables.
    min_coverage: 0.8
    # Median of N trading days at each endpoint instead of a single close.
    endpoint_window: 3
    # Fraction of the window's expected trading sessions a ticker must have.
    # min_coverage only checks that first and last observations span the
    # window; this checks the history in between is actually there.
    min_observation_ratio: 0.5
    # Refuse to screen a price file whose newest row is older than this.
    max_data_age_days: 5
    # This universe is exchange-traded funds only.
    asset_types: [etf]
    # Universe categories held out of the screen. Geared and inverse funds
    # return a multiple of something else's move, so they lead a growth
    # ranking by construction rather than by outperforming -- and a reverse
    # split on one prints a figure that is simply wrong: BBUS topped a
    # one-year ASX screen at +591% on a single 2.84 -> 27.96 step that was a
    # 1-for-10 consolidation, not a return. Their price history is still
    # published, so they stay chartable. Set to [] to screen them anyway.
    exclude_categories: [leveraged]
    # Publish price history for matched tickers as well as the screen results,
    # for charting. Screen results are unaffected either way.
    include_price_history: true
    # How densely to sample it. Each mode keeps the last trading day of the
    # period, so the series always ends on the newest close.
    #   daily        every session (~251 rows/ticker, ~94% of the database)
    #   weekly       last session of each week (~53 rows)
    #   semi_monthly last session of each half-month (~25 rows)
    #   month_end    last session of each month (~13 rows)
    # Weekly is the default: 5x smaller than daily, and it tracks the daily
    # line more closely than the denser first/fifteenth/last-of-month sampling
    # (11.9% vs 14.1% worst-case deviation), because month anchors cluster --
    # a month's last session and the next month's first are one day apart.
    price_history_sampling: weekly
    # Sampling is suspended for the last N days, where N is the longest
    # day-based window below. Weekly leaves one or two points across a 7-day
    # window and neither need be the session the screen measured from, so a
    # ticker that moved mid-week is charted as a flat line that disagrees with
    # its own percentage. Derived, not configured: no day window, no tail.
    # Also publish a trailing-12-month history for *every* ticker in
    # config/asx_etf.csv, not just the ones a window matched, so any ticker in
    # the universe can be charted. Lands in the ASX_1_YEAR_HISTORY table,
    # sampled at price_history_sampling above and indexed on
    # (ticker, stock_price_date). The existing screen tables are unaffected.
    # ~400 tickers x ~53 weekly points is ~21k rows, under 2 MB.
    include_universe_history: true
    windows:
      - {months: 12, label: 1_year, threshold: 25.0}
      - {months: 6, label: 6_months, threshold: 25.0}
      - {months: 3, label: 3_months, threshold: 25.0}
      - {months: 1, label: 1_month, threshold: 10.0}
      # A 7-day window holds only ~5-6 sessions, too few for the 3-day
      # endpoint median used elsewhere: one short trading week would exclude
      # everything, so min_coverage is halved. (endpoint_window is set for
      # completeness and applies only under return_basis: robust -- the
      # google_finance basis above is defined on single closes.)
      #
      # 5%, not the 10% the month window uses. An ETF is a basket, so a weekly
      # move that size needs a whole sector running: on the week to 28 Aug
      # 2026, of 347 eligible ETFs exactly one cleared 10% and the median
      # change was +0.08%. A screen that lists one row most weeks is not a
      # screen, it is a coin flip. At 5% that week lists five -- uranium,
      # copper and hydrogen together -- which is a readable sector story
      # rather than a single name.
      - {days: 7, label: 7_days, threshold: 5.0, endpoint_window: 2, min_coverage: 0.5}
