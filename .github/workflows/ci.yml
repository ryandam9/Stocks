name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # The lock file pins transitive versions too; yfinance in particular
        # changes response shape between minor releases.
        run: |
          uv venv
          uv pip install -r requirements.lock
          uv pip install pytest ruff

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Tests
        # The suite is offline: every provider call is stubbed, so CI never
        # depends on Yahoo being reachable.
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: stocks:ci
      - name: Smoke test
        # No network: proves the image is importable and the CLI is wired,
        # without depending on the price provider being reachable.
        run: |
          docker run --rm stocks:ci --help
          docker run --rm --network none --entrypoint python stocks:ci -c \
            "import sys; sys.path.insert(0,'/app/src'); import run, pipeline, analysis; \
             from zoneinfo import ZoneInfo; ZoneInfo('America/New_York'); print('ok')"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # bootstrap is a separate root module with its own provider block, so
        # validating infra/ alone would not cover it.
        dir: [infra, infra/bootstrap]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=${{ matrix.dir }} fmt -check -recursive

      - name: Init
        # -backend=false skips the S3 backend, so this needs no AWS
        # credentials and no state bucket. Providers still come from the
        # registry, which is all validate requires.
        run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=${{ matrix.dir }} validate
