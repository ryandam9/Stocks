line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # click decorators legitimately call functions in defaults
]

[lint.per-file-ignores]
# Tests import fixtures from conftest and shadow names deliberately.
"tests/*" = ["F811"]
